name: CI

on:
  pull_request:
  push:

jobs:
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Hassfest
        uses: home-assistant/actions/hassfest@master

  lint_and_security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements_dev.txt

      - name: Lint
        run: ruff check .

      - name: Bandit
        run: bandit -q -r custom_components/modbus_1ecodesign_heatpump

      - name: Pip Audit
        run: pip-audit -r requirements_security.txt
