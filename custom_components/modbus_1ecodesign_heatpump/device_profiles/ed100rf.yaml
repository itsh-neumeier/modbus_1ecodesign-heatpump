id: ed100rf
name:
  en: "ED100RF"
  de: "ED100RF"
model: "ED100RF"
manufacturer: "1EcoDesign GmbH"
timer:
  supported: true
  enable_register: 7
  start_hour_register: 8
  start_minute_register: 9
  stop_hour_register: 10
  stop_minute_register: 11
  allow_cross_midnight: true
entity_overrides:
  sensor:
    t1_evaporator_temperature:
      address: 8
      translation_key: "t1_tank_temperature"
    t2_tank_temperature:
      address: 7
      translation_key: "t2_evaporator_temperature"
  select:
    fan_operation:
      option_map:
        0: "ac_low"
        1: "ac_high"
    ventilation_control:
      entity_registry_enabled_default: false
